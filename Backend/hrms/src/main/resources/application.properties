# ===============================
#  APPLICATION CONFIGURATION
# ===============================
server.port=8080
spring.application.name=HRMS

# ===============================
#  DATABASE CONFIGURATION
# ===============================
# Note: remove createTableIfNotExists in production if you manage schema via Flyway
spring.datasource.url=jdbc:mysql://localhost:3306/hrms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=2310
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
#  JPA / HIBERNATE CONFIG
# ===============================
# For development you can keep "update". For production prefer "validate" or manage schema with Flyway (ddl-auto=none).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Use MySQL8 dialect for modern MySQL/MariaDB versions. Change if you run an older server.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===============================
#  FILE UPLOAD (Multipart) CONFIG
#  Important for profile photo / aadhar uploads
# ===============================
# Maximum size for a single uploaded file
spring.servlet.multipart.max-file-size=15MB
# Maximum size for a full multipart request
spring.servlet.multipart.max-request-size=20MB
# Optional: location to temporarily store uploads (OS tmp dir used by default)
# spring.servlet.multipart.location=/tmp

# ===============================
#  FLYWAY (DB MIGRATIONS)
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# When first enabling Flyway on an existing DB, consider baselineOnMigrate=true
spring.flyway.baseline-on-migrate=true

# ===============================
#  MAIL CONFIG (example, replace with real creds)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
#  SWAGGER / OPENAPI (Optional)
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
#  JWT CONFIG
# ===============================
# NOTE: Do NOT commit a real secret to version control. Use environment variables / Vault in production.
jwt.secret=F6Jt!2s@L9p^aQw3rT7yUi0oPlMnBvCx
jwt.expiration=86400000

# ===============================
#  ADMIN CONFIGURATION (initial seeding)
# ===============================
